<style>

  #wins div { display: flex; align-items: center; gap: 8px; } #wins b { margin-left: auto; font-variant-numeric: tabular-nums; }
  #wins i { width: 9px; height: 9px; border-radius: 2px; box-shadow: 0 0 6px currentColor; background: currentColor; }
  #wins .out { opacity: .38; } #wins .me { font-weight: 800; }
  #map { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 116px; height: 116px;
         border-radius: 10px; background: #000a; box-shadow: 0 0 0 1px #39f3ff44, 0 0 18px #39f3ff22; pointer-events: none; }
  #count { inset: 0; display: grid; place-items: center; font-size: min(28vw, 170px); font-weight: 900; color: #fff; text-shadow: 0 0 20px #39f3ff, 0 0 60px #39f3ff; }

  #hint { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 104px); left: 0; right: 0; text-align: center; font-size: 15px; padding: 0 16px; transition: opacity .8s; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .75; white-space: nowrap; }
  .touch #net { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 92px); } .touch #hint { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 120px); }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #02030a99; pointer-events: none; }

          box-shadow: 0 0 40px #39f3ff33; pointer-events: auto; }

<script type="module">
/* ═══ LIGHT CYCLES · a Multiplayer Agent starter ══════════════════════════════════════
 * Your trail is a wall. Last rider wins. Versus, 2–6 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ arena size, speed, round timers, bots, start spots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   GRID .......... the arena as cells: whose wall is where, free-space checks
 *   ARENA ......... the 3D scene: floor, edges, glowing trail walls, the cycle model
 *   ROUND (HOST) .. countdown, ride, round over, wins, and the bots. Only the host writes these.
 *   MY CYCLE ...... turning, moving cell by cell, crashing. Each player writes only its own.
 *   EFFECTS ....... explosions, derez, sound
 *   HUD & RESULTS . riders left, wins, countdown, minimap, results card, leaderboard
 *   INPUT ......... keyboard, tap left/right, on-screen buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Cycles move one grid cell at a time and only turn 90°, so a trail is just its
 *     turn points. Each player writes its OWN entity: `trail` {r, p:[[x,z],…]} when it
 *     turns, `bike` {r, x, z, d, a} (cell, heading, alive) on every cell step,
 *     `hb` (heartbeat) once a second, and `n`/`color` once. `r` is the round id.
 *   - Each rider decides its own crash (its own fact): it sets a:0 in `bike`.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last
 *     3s), worked out every frame. Only the host writes the shared fields `round`
 *     {id, v, phase, startAt, endsAt, riders, alive, winner, wins}, `bots` and the bot
 *     trails `bt0`…`bt5`. A new host adopts all of them from state and carries on.
 *   - A new round starts only when the host bumps round.id; every client then puts its
 *     cycle on its start spot. Someone who joins mid-round watches, then rides next round.
 *   - No intents are needed: crashes are each rider's own fact, the rest is the host's.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "rounds-won": +1 for each round you win, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  arena: 64,           // the arena is arena × arena cells (one cell = one world unit)
  speed: 12,           // cells per second
  seats: 4,            // bots fill each round up to this many riders
  maxRiders: 6,        // riders per round; anyone else watches and rides the next one
  countdown: 3000,     // ms on the start spots before GO
  overFor: 4500,       // ms the result shows before the next round
  maxRound: 90000,     // ms before a round ends in a draw
  closeCall: 400,      // ms: if the last two crash this close together, it's a draw
  botLook: [2, 6],     // a bot starts dodging when a wall is this many cells ahead (each bot gets one)
  botMistake: 0.06,    // chance a bot misjudges a dodge
  botSwerve: 0.035,    // chance per cell a bot turns on purpose (toward a rival or open space)
  wallHeight: 1.1,     // trail wall height, world units
  board: "rounds-won", // leaderboard name
  // Start spots: [x, z, heading], x and z as a share of the arena. Heading 0 east, 1 south, 2 west, 3 north.
  spawns: [[0.15, 0.35, 0], [0.85, 0.65, 2], [0.65, 0.15, 1], [0.35, 0.85, 3], [0.1, 0.55, 0], [0.9, 0.45, 2]],
};
const BOT_NAMES = ["Volt", "Pixel", "Flux", "Glitch", "Quark", "Neon"];
const COLORS = ["#39f3ff", "#ff8a1f", "#ff3df0", "#9dff3a", "#ffe53d", "#8f6bff", "#ff4d6a", "#5dffb8"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'light-cycles',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { arena: 48, seats: 6, speed: 13, countdown: 1200, overFor: 1400, botMistake: 0.01, botSwerve: 0.06 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fb) { const raw = S.shared[key], m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
/** A JSON field on another player's entity, parsed once per change (read-only). */
function field(id, key) { const raw = S.entities.players[id]?.[key], k = id + "/" + key, m = memo.get(k); if (m && m.raw === raw) return m.v; const v = parse(raw, null); memo.set(k, { raw, v }); return v; }
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── GRID ────────────────────────────────────────────────────────────────────────────
const A = CONFIG.arena;
const DX = [1, 0, -1, 0], DZ = [0, 1, 0, -1];      // heading 0 east, 1 south, 2 west, 3 north
const turnLeft = (d) => (d + 3) % 4, turnRight = (d) => (d + 1) % 4;
const inside = (x, z) => x >= 0 && z >= 0 && x < A && z < A;
const wx = (x) => x - A / 2 + 0.5, wz = (z) => z - A / 2 + 0.5; // cell -> world
const heading = (d) => Math.atan2(DX[d], DZ[d]);
// Most turn points one trail may hold, so the field stays under 2048 characters.
const MAX_TURNS = Math.floor(1950 / (String(A).length * 2 + 4));
function spawnOf(slot) { const [fx, fz, d] = CONFIG.spawns[slot % CONFIG.spawns.length]; return { x: Math.floor(fx * A), z: Math.floor(fz * A), d }; }

const grid = new Uint8Array(A * A); // 0 = free, otherwise 1 + the index of the rider whose wall it is
const gridOwner = new Map();        // rider id -> the value its walls have in `grid`
const free = (x, z) => inside(x, z) && !grid[z * A + x];
function markLine(ax, az, bx, bz, v) {
  if (ax !== bx && az !== bz) return; // half-arrived update (looks diagonal): skip until it settles
  const sx = Math.sign(bx - ax), sz = Math.sign(bz - az), n = Math.abs(bx - ax) + Math.abs(bz - az);
  for (let k = 0; k <= n; k++) { const x = ax + sx * k, z = az + sz * k; if (inside(x, z)) grid[z * A + x] = v; }
}
/** Rebuild the walls from every living rider's turn points + current cell. */
function buildGrid(list) {
  grid.fill(0); gridOwner.clear();
  list.forEach((r, i) => {
    gridOwner.set(r.id, i + 1);
    if (!r.alive) return;
    for (let k = 0; k < r.trail.length; k++) { const a = r.trail[k], b = r.trail[k + 1] || [r.x, r.z]; markLine(a[0], a[1], b[0], b[1], i + 1); }
  });
}
function freeRun(x, z, d, max) { let n = 0; while (n < max && free(x + DX[d] * (n + 1), z + DZ[d] * (n + 1))) n++; return n; }
const seen = new Uint32Array(A * A); let stamp = 0;
/** How many cells you can still reach by going `d` from (x, z), up to `limit`. */
function space(x, z, d, limit) {
  const sx = x + DX[d], sz = z + DZ[d];
  if (!free(sx, sz)) return 0;
  const q = [sz * A + sx]; seen[q[0]] = ++stamp;
  for (let n = 0; n < q.length && q.length < limit; n++) {
    const cx = q[n] % A, cz = (q[n] / A) | 0;
    for (let k = 0; k < 4; k++) { const nx = cx + DX[k], nz = cz + DZ[k], j = nz * A + nx; if (free(nx, nz) && seen[j] !== stamp) { seen[j] = stamp; q.push(j); } }
  }
  return q.length;
}

// ── ARENA ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#04050c");
scene.fog = new THREE.Fog("#1c0c44", 24, 90); // the same violet as the horizon, so the floor fades into it
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 300);
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 86 : 70; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#9fd8ff", "#0a0f22", 1.2));
// Sky: a dome that glows violet at the horizon, with a few stars.
const skyGeo = new THREE.SphereGeometry(220, 32, 16), skyCols = [], skyTop = new THREE.Color("#02030a"), skyLow = new THREE.Color("#1c0c44");
for (let i = 0, p = skyGeo.attributes.position; i < p.count; i++) skyCols.push(...skyLow.clone().lerp(skyTop, Math.min(1, Math.max(0, p.getY(i) / 120))).toArray());
skyGeo.setAttribute("color", new THREE.Float32BufferAttribute(skyCols, 3));
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
const starPos = []; for (let i = 0; i < 400; i++) { const a = Math.random() * Math.PI * 2, y = 20 + Math.random() * 180; starPos.push(Math.cos(a) * 200, y, Math.sin(a) * 200); }
const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3)), new THREE.PointsMaterial({ color: "#9fd8ff", size: 1.6, sizeAttenuation: false, fog: false }));
scene.add(stars);
const sun = new THREE.DirectionalLight("#ffffff", 1.2); sun.position.set(20, 40, 10); scene.add(sun);

function canvasTex(w, h, paint) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
// The floor: one texture tile = 4×4 cells. The arena is brighter than the outside.
const gridTex = (minor, major) => canvasTex(256, 256, (c, w) => {
  c.fillStyle = "#050816"; c.fillRect(0, 0, w, w);
  c.fillStyle = minor; for (let i = 1; i < 4; i++) { c.fillRect(i * 64 - 1, 0, 2, w); c.fillRect(0, i * 64 - 1, w, 2); }
  c.fillStyle = major; c.fillRect(0, 0, 3, w); c.fillRect(0, 0, w, 3);
});
const floorIn = gridTex("#0e2244", "#1c4f8c"); floorIn.repeat.set(A / 4, A / 4);
const floorOut = gridTex("#070d1c", "#0c1a33"); floorOut.repeat.set((A + 80) / 4, (A + 80) / 4);
const arenaFloor = new THREE.Mesh(new THREE.PlaneGeometry(A, A), new THREE.MeshBasicMaterial({ map: floorIn }));
arenaFloor.rotation.x = -Math.PI / 2; arenaFloor.position.y = 0.002; scene.add(arenaFloor);
const outFloor = new THREE.Mesh(new THREE.PlaneGeometry(A + 80, A + 80), new THREE.MeshBasicMaterial({ map: floorOut }));
outFloor.rotation.x = -Math.PI / 2; scene.add(outFloor);
// The arena edge: four low glowing walls.
const edgeMat = new THREE.MeshBasicMaterial({ color: "#39f3ff", transparent: true, opacity: 0.4 });
for (const [x, z, sx, sz] of [[0, -A / 2, A + 0.4, 0.2], [0, A / 2, A + 0.4, 0.2], [-A / 2, 0, 0.2, A], [A / 2, 0, 0.2, A]]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, 1.2, sz), edgeMat); m.position.set(x, 0.6, z); scene.add(m);
}

// Trail walls: three instanced layers (hot core, soft glow, light on the floor), rebuilt every frame.
const MAX_SEGS = 1800, box = new THREE.BoxGeometry(1, 1, 1), WHITE = new THREE.Color("#fff");
const additive = (opacity) => new THREE.MeshBasicMaterial({ transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
const layers = [
  { mesh: new THREE.InstancedMesh(box, new THREE.MeshBasicMaterial(), MAX_SEGS), pad: 0.14, h: 1, y: 0.5 },
  { mesh: new THREE.InstancedMesh(box, additive(0.16), MAX_SEGS), pad: 0.55, h: 1.3, y: 0.6 },
  { mesh: new THREE.InstancedMesh(box, additive(0.3), MAX_SEGS), pad: 1.3, h: 0.02, y: 0.01, flat: true },
];
for (const l of layers) { for (let i = 0; i < MAX_SEGS; i++) l.mesh.setColorAt(i, WHITE); l.mesh.count = 0; l.mesh.frustumCulled = false; scene.add(l.mesh); }
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpP = new THREE.Vector3(), tmpS = new THREE.Vector3(), tmpC = new THREE.Color();
let segN = 0;
/** One straight piece of wall from cell (ax, az) to (bx, bz); hk scales the height (derez). */
function addSeg(ax, az, bx, bz, color, hk) {
  if (segN >= MAX_SEGS) return;
  const cx = wx((ax + bx) / 2), cz = wz((az + bz) / 2), lx = Math.abs(bx - ax), lz = Math.abs(bz - az), h = CONFIG.wallHeight * hk;
  tmpC.set(color);
  for (const l of layers) {
    const hh = l.flat ? l.h : h * l.h;
    tmpM.compose(tmpP.set(cx, l.flat ? l.y : hh / 2, cz), tmpQ, tmpS.set(lx + l.pad, hh, lz + l.pad));
    l.mesh.setMatrixAt(segN, tmpM); l.mesh.setColorAt(segN, tmpC);
  }
  segN++;
}
function finishSegs() { for (const l of layers) { l.mesh.count = segN; l.mesh.instanceMatrix.needsUpdate = true; l.mesh.instanceColor.needsUpdate = true; } segN = 0; }

// The cycle: a dark body, glowing wheels and stripe, a light under it, and a name tag.
const glowTex = canvasTex(64, 64, (c) => { const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, "#ffffffcc"); g.addColorStop(1, "#ffffff00"); c.fillStyle = g; c.fillRect(0, 0, 64, 64); });
function makeBike(color, name) {
  const g = new THREE.Group(), neon = new THREE.MeshBasicMaterial({ color });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.32, 1.25), new THREE.MeshStandardMaterial({ color: "#10162a", metalness: 0.6, roughness: 0.35 }));
  body.position.y = 0.42; g.add(body);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.06, 1.27), neon); stripe.position.y = 0.42; g.add(stripe);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), new THREE.MeshStandardMaterial({ color: "#0b0f1e", emissive: color, emissiveIntensity: 0.35, roughness: 0.2 }));
  canopy.scale.set(0.9, 0.7, 1.6); canopy.position.set(0, 0.62, 0.05); g.add(canopy);
  for (const z of [-0.48, 0.48]) { const w = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.06, 6, 18), neon); w.rotation.y = Math.PI / 2; w.position.set(0, 0.28, z); g.add(w); }
  const under = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.7 }));
  under.scale.set(2.6, 2.6, 1); under.position.y = 0.15; g.add(under);
  if (name) {
    const tex = canvasTex(256, 64, (c) => { c.font = "bold 32px system-ui"; c.textAlign = "center"; c.lineWidth = 6; c.strokeStyle = "#000c"; c.strokeText(name, 128, 42); c.fillStyle = color; c.fillText(name, 128, 42); });
    const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, sizeAttenuation: false })); tag.scale.set(0.2, 0.05, 1); tag.position.y = 1.6; g.add(tag);
  }
  scene.add(g); return g;
}

// ── ROUND (HOST) ────────────────────────────────────────────────────────────────────
const host = { bots: new Map(), wasHost: false, last: null, endSince: 0, lastFlush: 0, dirty: new Set(), lastBots: "" };
/** The round as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function round() { const r = shared("round", null); return host.last && isHost() && (!r || host.last.v > r.v) ? host.last : r; }
function writeRound(r) { r = { ...r, v: (round()?.v ?? 0) + 1 }; host.last = r; net.setShared("round", JSON.stringify(r)); return r; }
const rnd = (a, b) => a + Math.random() * (b - a);
const nameOf = (id) => (id === net.sessionId ? myName : S.entities.players[id]?.n || "Rider");
const colorOf = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.color || "#ffffff");

  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the round meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  let r = round();
  if (r) { frameRiders = riders(r); buildGrid(frameRiders); }
  if (isHost()) { hostTick(dt, now); r = round(); } else host.wasHost = false;
  if (r) { myTick(dt, r); frameRiders = riders(r); drawWorld(r, now, dt); if (now - lastHud > 100) { lastHud = now; hud(r); drawMap(frameRiders); } }
  stepEffects(dt);
  renderer.render(scene, camera);
}

/** Cycles, trail walls and the chase camera, all from this frame's riders. */
function drawWorld(r, now, dt) {
  const seenIds = new Set();
  let focus = null;
  for (const rd of frameRiders) {
    const vid = rd.id + rd.color;
    seenIds.add(vid);
    let v = views.get(vid);
    if (!v) { v = { g: makeBike(rd.color, rd.mine || ATTRACT ? "" : rd.name), cell: "", at: now, h: heading(rd.d), wasAlive: rd.alive, diedAt: 0 }; views.set(vid, v); }
    const cell = rd.x + "," + rd.z + "," + rd.d;
    if (cell !== v.cell) { v.cell = cell; v.at = now; }
    // Where the head is drawn: my cycle and the host's bots are exact; everyone else is eased forward from their last cell.
    const ahead = !rd.alive || r.phase !== "ride" ? 0 : rd.f !== undefined ? rd.f : Math.min(1, ((now - v.at) / 1000) * CONFIG.speed);
    const lastPt = rd.trail[rd.trail.length - 1];
    const straight = lastPt && (DX[rd.d] ? lastPt[1] === rd.z : lastPt[0] === rd.x); // false while a turn is still on its way
    const hx = rd.x + DX[rd.d] * ahead, hz = rd.z + DZ[rd.d] * ahead;
    rd.hx = hx; rd.hz = hz;
    if (v.wasAlive && !rd.alive) { v.diedAt = now; if (!rd.mine && !(rd.bot && isHost())) boom(rd.x + DX[rd.d] * 0.5, rd.z + DZ[rd.d] * 0.5, rd.color); }
    v.wasAlive = rd.alive;
    const derez = rd.alive ? 1 : Math.max(0, 1 - (now - v.diedAt) / 700);
    v.g.visible = rd.alive;
    v.g.position.set(wx(hx), 0, wz(hz));
    v.h += Math.atan2(Math.sin(heading(rd.d) - v.h), Math.cos(heading(rd.d) - v.h)) * (1 - Math.pow(0.0001, dt));
    v.g.rotation.y = v.h;
    if (derez > 0) {
      for (let k = 0; k < rd.trail.length - 1; k++) addSeg(rd.trail[k][0], rd.trail[k][1], rd.trail[k + 1][0], rd.trail[k + 1][1], rd.color, derez);
      if (straight) addSeg(lastPt[0], lastPt[1], hx, hz, rd.color, derez);
    }
    if (rd.mine && (rd.alive || now - me.diedAt < 1400)) focus = rd;
  }
  finishSegs();
  for (const [id, v] of views) if (!seenIds.has(id)) { scene.remove(v.g); views.delete(id); }
  // The camera follows me; when I'm out it follows the winner, or someone still riding.
  if (!focus) {
    const pick = (id) => frameRiders.find((x) => x.id === id && (x.alive || r.phase === "over"));
    focus = (r.phase === "over" && pick(r.winner)) || pick(cam.follow) || frameRiders.find((x) => x.alive) || null;
    if (focus && focus.id !== cam.follow) { cam.follow = focus.id; }
  }
  const fx = focus ? wx(focus.hx) : 0, fz = focus ? wz(focus.hz) : 0;
  const orbit = r.phase === "over" && focus && focus.alive;
  const wantH = orbit ? cam.h + dt * 0.6 : focus ? heading(focus.d) : cam.h + dt * 0.2;
  cam.h += Math.atan2(Math.sin(wantH - cam.h), Math.cos(wantH - cam.h)) * (orbit ? 1 : 1 - Math.pow(0.004, dt));
  const tall = camera.aspect < 1; // a phone held upright sees more floor from a little higher up
  const back = !focus ? 40 : orbit ? 9 : ATTRACT ? 8 : 6, up = !focus ? 30 : orbit ? 5 : ATTRACT ? 6 : tall ? 4.6 : 3.4;
  const want = new THREE.Vector3(fx - Math.sin(cam.h) * back, up, fz - Math.cos(cam.h) * back);
  if (cam.snap) { camera.position.copy(want); cam.snap = false; } else camera.position.lerp(want, 1 - Math.pow(0.0005, dt));
  if (cam.shake > 0) { cam.shake = Math.max(0, cam.shake - dt); camera.position.x += rnd(-1, 1) * cam.shake; camera.position.y += rnd(-1, 1) * cam.shake * 0.5; }
  const look = tall || ATTRACT ? 3 : 5;
  camera.lookAt(fx + Math.sin(cam.h) * look, 0.6, fz + Math.cos(cam.h) * look);
}

/** If someone with a lower id (or a bot) has my color (the room can look empty at the moment I join), take a free one. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), botColors = (round()?.riders || []).filter((x) => x.b).map((x) => x.c);
  if (!others.some(([id, p]) => p.color === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.color), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor;
  net.me.set("color", myColor);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.color), ...(shared("round", null)?.riders || []).filter((x) => x.b).map((x) => x.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, color: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
